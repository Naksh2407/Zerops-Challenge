zerops:
  - setup: backend
    build:
      base: ubuntu@22.04
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles:
        - backend
    run:
      base: ubuntu@22.04
      ports:
        - port: 8000
          httpSupport: true
      start: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
      envVariables:
        GEMINI_API_KEY: ""

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles:
        - frontend/dist/~

