zerops:
  - setup: backend
    build:
      base: python@3.12
      os: ubuntu
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.12
      os: ubuntu
      ports:
        - port: 8000
          httpSupport: true
      start: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000


  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      os: alpine
      base: static

